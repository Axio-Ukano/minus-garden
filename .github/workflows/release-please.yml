name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps Cargo.toml but can't touch Cargo.lock (only cargo can).
      # This step syncs the lock inside the release PR so it's ready to merge cleanly.
      - name: Get release PR branch
        if: ${{ steps.release.outputs.pr }}
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: echo "branch=$(gh pr view ${{ steps.release.outputs.pr }} --repo ${{ github.repository }} --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ steps.pr-info.outputs.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Sync Cargo.lock version
        if: ${{ steps.release.outputs.pr }}
        run: |
          NEW_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Target version: $NEW_VERSION"

          # Update the minus-garden package version in Cargo.lock
          sed -i '/^name = "minus-garden"$/{n;s/version = ".*"/version = "'"$NEW_VERSION"'"/}' src-tauri/Cargo.lock

          if ! git diff --quiet src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "chore: sync Cargo.lock with version bump"
            git push
            echo "✔ Cargo.lock synced to $NEW_VERSION"
          else
            echo "✔ Cargo.lock already in sync"
          fi
